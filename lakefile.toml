  "Nikoghosyan.FactorCycleIndex",
  "Nikoghosyan.FactorPCExtraction",
  "Nikoghosyan.AllCographStructure",
  "Nikoghosyan.EndpointSeamAssembly",
  "Nikoghosyan.AllCographFactor",
  "Nikoghosyan.InducedCutTransport",
